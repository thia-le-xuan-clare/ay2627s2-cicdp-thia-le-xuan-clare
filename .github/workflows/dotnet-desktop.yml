# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# This workflow will build, test, and publish a WPF or Windows Forms desktop application built on modern .NET.
name: .NET Core Desktop

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Waddle.slnx
      Test_Project_Path: Waddle.Tests/Waddle.Tests.csproj
      UI_Test_Project_Path: Waddle.UITests/Waddle.UITests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore the application
        run: dotnet restore ${{ env.Solution_Name }}

      - name: Build solution
        run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

      - name: Execute unit and integration tests
        run: >
          dotnet test ${{ env.Test_Project_Path }}
          --configuration ${{ matrix.configuration }}
          --no-build
          --logger "trx;LogFileName=test-results-${{ matrix.configuration }}.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Execute WPF UI automation tests
        if: matrix.configuration == 'Release'
        run: >
          dotnet test ${{ env.UI_Test_Project_Path }}
          --configuration ${{ matrix.configuration }}
          --no-build
          --logger "trx;LogFileName=ui-test-results.trx"
          --results-directory ./TestResults

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Waddle Tests (${{ matrix.configuration }})
          path: "./TestResults/*.trx"
          reporter: dotnet-trx

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: matrix.configuration == 'Release'
        with:
          filename: "./TestResults/**/coverage.cobertura.xml"
          badge: true
          format: markdown
          output: both

      - name: Publish Binaries
        run: dotnet publish Waddle.Wpf/Waddle.Wpf.csproj --configuration ${{ matrix.configuration }} --output ./publish_output/${{ matrix.configuration }} --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Waddle-Wpf-App-${{ matrix.configuration }}
          path: ./publish_output/${{ matrix.configuration }}
