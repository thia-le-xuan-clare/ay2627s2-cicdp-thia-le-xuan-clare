name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  

    env:
      Solution_Name: Waddle.slnx
      Test_Project_Path: Waddle.Tests/Waddle.Tests.csproj
      UI_Test_Project_Path: Waddle.UITests/Waddle.UITests.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore the application
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Build solution
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Execute unit and integration tests
      run: >
        dotnet test ${{ env.Test_Project_Path }}
        --configuration ${{ matrix.configuration }}
        --no-build
        --logger "trx;LogFileName=test-results-${{ matrix.configuration }}.trx"
        --collect:"XPlat Code Coverage"
        --results-directory ./TestResults

    - name: Execute WPF UI automation tests
      if: matrix.configuration == 'Release'
      run: >
        dotnet test ${{ env.UI_Test_Project_Path }}
        --configuration ${{ matrix.configuration }}
        --no-build
        --logger "trx;LogFileName=ui-test-results.trx"
        --results-directory ./TestResults

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Waddle Tests (${{ matrix.configuration }})
        path: './TestResults/*.trx'
        reporter: dotnet-trx

    - name: Code Coverage Summary
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
      if: matrix.configuration == 'Release'
      with:
        reports: './TestResults/**/coverage.cobertura.xml'
        targetdir: './CoverageReport'
        reporttypes: 'MarkdownSummaryGithub'

    - name: Publish Coverage to Job Summary
      if: matrix.configuration == 'Release'
      run: Get-Content ./CoverageReport/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

    - name: Publish Binaries
      run: dotnet publish Waddle.Wpf/Waddle.Wpf.csproj --configuration ${{ matrix.configuration }} --output ./publish_output/${{ matrix.configuration }} --no-build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Waddle-Wpf-App-${{ matrix.configuration }}
        path: ./publish_output/${{ matrix.configuration }}
