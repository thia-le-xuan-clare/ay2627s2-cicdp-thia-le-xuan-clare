name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Publish self-contained app
      run: dotnet publish Waddle.Wpf/Waddle.Wpf.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Build installer
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        iscc "/DMyAppVersion=$version" installer\waddle.iss

    - name: Create GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" (Get-ChildItem installer/output/*.exe).FullName --title "Waddle ${{ github.ref_name }}" --generate-notes